name: CI

# "GitHub onde precisa": valida o build do app a cada push/PR.
# O app mora em app/ (pasta renomeada de sasi-v2/ em 22-nov-2026).
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
