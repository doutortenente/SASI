name: CI

# Valida o build do app a cada push/PR. O app Next.js mora na raiz do repositório.
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
